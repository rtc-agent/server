# golangci-lint configuration for centrifuge-plus
# Version: 2.x format

version: "2"

run:
  timeout: 5m
  go: "1.27"
  tests: true

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gocyclo
    - misspell
    - revive
    - gosec

  settings:
    gocyclo:
      min-complexity: 20

    misspell:
      locale: US

    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
