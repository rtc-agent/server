# RTC Agent Server Prometheus Alert Rules
#
# This file defines alerting rules for monitoring RTC Agent Server health,
# security, performance, and resource utilization.
#
# Import this file into your Prometheus configuration:
#   rule_files:
#     - "prometheus-alerts.yml"
#
# Last updated: 2026-10-10

groups:
  # ============================================================================
  # Security Alerts
  # ============================================================================
  - name: rtc-agent-security
    rules:
      # Ban check fail-open detection
      # When this alert fires, the system is allowing potentially banned users
      # to connect because the ban check service is unavailable.
      - alert: BanCheckFailOpen
        expr: rate(rtc_auth_security_events_total{event_type="ban_check_fail_open"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Ban check is failing open"
          description: "Ban check failures detected for {{ $labels.instance }}. Users may bypass ban restrictions due to unavailable ban service."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#banchcheckfailopen"

      # Authentication failure spike detection
      # A sudden increase in auth failures may indicate credential stuffing or token abuse.
      - alert: AuthFailureSpike
        expr: sum(rate(rtc_auth_failures_total[5m])) by (type) > 10
        for: 2m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "High authentication failure rate"
          description: "{{ $value }} auth failures per second for type={{ $labels.type }}. Possible credential stuffing or token abuse."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#authfailurespike"

  # ============================================================================
  # Configuration Management Alerts
  # ============================================================================
  - name: rtc-agent-config
    rules:
      # Config fallback to YAML defaults
      # Indicates DB is unavailable and system is using baseline configuration.
      - alert: ConfigFallbackToDefaults
        expr: rate(rtc_config_fallback_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          category: config
        annotations:
          summary: "Config falling back to YAML defaults"
          description: "Database config lookup failed for key={{ $labels.key }}, reason={{ $labels.reason }}. System is using baseline configuration."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#configfallbacktodefaults"

      # Circuit breaker state change (DB connection issues)
      # When circuit breaker opens, DB operations are blocked.
      - alert: CircuitBreakerOpen
        expr: rtc_circuitbreaker_state{name="db", state="open"} == 1
        for: 1m
        labels:
          severity: critical
          category: config
        annotations:
          summary: "DB circuit breaker opened"
          description: "Database circuit breaker is open. All DB operations are blocked, config reads are using YAML defaults."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#circuitbreakeropen"

      # Frequent circuit breaker state changes (flapping)
      # Indicates unstable database connection.
      - alert: CircuitBreakerFlapping
        expr: rate(rtc_circuitbreaker_state_changes_total{name="db"}[10m]) > 0.5
        for: 5m
        labels:
          severity: warning
          category: config
        annotations:
          summary: "Circuit breaker state flapping"
          description: "Circuit breaker for {{ $labels.name }} changed state {{ $value }} times per second in the last 10 minutes. Database connection may be unstable."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#circuitbreakerflapping"

  # ============================================================================
  # Performance Alerts
  # ============================================================================
  - name: rtc-agent-performance
    rules:
      # High HTTP latency (p95)
      # 95th percentile latency above 1 second for sustained period.
      - alert: HighHTTPLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (handler, le)) > 1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High HTTP request latency"
          description: "95th percentile latency for {{ $labels.handler }} is {{ $value }}s (threshold: 1s)."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#highhttplatency"

      # High HTTP error rate
      # More than 5% of requests returning 5xx errors.
      - alert: HighHTTPErrorRate
        expr: sum(rate(http_requests_total{code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "High HTTP error rate"
          description: "{{ $value | humanizePercentage }} of HTTP requests are failing with 5xx errors."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#highhttperrorrate"

      # LLM API high latency
      # LLM calls taking too long may indicate API issues or model problems.
      - alert: LLMAPIHighLatency
        expr: histogram_quantile(0.95, sum(rate(rtc_llm_http_request_duration_seconds_bucket[5m])) by (model, le)) > 30
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "LLM API high latency"
          description: "95th percentile LLM API latency for model={{ $labels.model }} is {{ $value }}s (threshold: 30s)."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#llmapihighlatency"

      # LLM API error rate
      # High error rate for LLM API calls.
      - alert: LLMAPIErrorRate
        expr: sum(rate(rtc_llm_http_requests_total{status="error"}[5m])) by (model) / sum(rate(rtc_llm_http_requests_total[5m])) by (model) > 0.1
        for: 2m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "LLM API high error rate"
          description: "{{ $value | humanizePercentage }} of LLM API calls for model={{ $labels.model }} are failing."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#llmapierrorrate"

      # Database query high latency
      # Slow database queries may indicate missing indexes or lock contention.
      - alert: DBQueryHighLatency
        expr: histogram_quantile(0.95, sum(rate(rtc_db_query_duration_seconds_bucket[5m])) by (operation, le)) > 0.5
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Database query high latency"
          description: "95th percentile DB query latency for {{ $labels.operation }} is {{ $value }}s (threshold: 0.5s)."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#dbqueryhighlatency"

  # ============================================================================
  # Resource & Capacity Alerts
  # ============================================================================
  - name: rtc-agent-resources
    rules:
      # Goroutine leak detection
      # High goroutine count may indicate leaked goroutines from context.WithoutCancel.
      - alert: GoroutineLeak
        expr: go_goroutines > 1000
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "Potential goroutine leak"
          description: "Goroutine count is {{ $value }} (threshold: 1000). Possible goroutine leak from background tasks."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#goroutineleak"

      # Queue processing delays
      # Long wait times in queue may indicate processing bottlenecks.
      - alert: QueueWaitTimeHigh
        expr: histogram_quantile(0.95, sum(rate(rtc_queue_wait_duration_seconds_bucket[5m])) by (le)) > 10
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "Queue wait time high"
          description: "95th percentile queue wait time is {{ $value }}s (threshold: 10s). Work items are waiting too long to be processed."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#queuewaittimehigh"

      # Queue publish errors
      # Failed publishes may indicate Redis connectivity issues.
      - alert: QueuePublishErrors
        expr: rate(rtc_queue_publish_total{status="error"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "Queue publish errors"
          description: "Queue publish failures detected. Rate: {{ $value }}/s. Redis may be unavailable."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#queuepublisherrors"

      # Queue claim errors
      # Failed claims may indicate processing issues or Redis problems.
      - alert: QueueClaimErrors
        expr: rate(rtc_queue_claim_total{status="error"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "Queue claim errors"
          description: "Queue claim failures detected. Rate: {{ $value }}/s."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#queueclaimerrors"

      # Database query errors
      # High error rate for database operations.
      - alert: DBQueryErrors
        expr: sum(rate(rtc_db_queries_total{status="error"}[5m])) by (operation) > 0.1
        for: 2m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "Database query errors"
          description: "Database query error rate for {{ $labels.operation }} is {{ $value }}/s."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#dbqueryerrors"

  # ============================================================================
  # Business Logic Alerts
  # ============================================================================
  - name: rtc-agent-business
    rules:
      # Stale turn recovery
      # High recovery rate may indicate turn processing issues.
      - alert: StaleTurnRecoveryHigh
        expr: sum(rate(rtc_recovery_stale_turns_recovered_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "High stale turn recovery rate"
          description: "Recovering {{ $value }} stale turns per second. Turn processing may be stuck or timing out."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#staleturnrecoveryhigh"

      # Interrupt rate spike
      # High interrupt rate may indicate user experience issues.
      - alert: InterruptRateHigh
        expr: sum(rate(rtc_interrupt_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "High interrupt rate"
          description: "Interrupt rate is {{ $value }}/s. Users may be experiencing timeouts or cancellations."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#interruptratehigh"

      # Checkpoint errors
      # Failed checkpoints may lead to data loss.
      - alert: CheckpointErrors
        expr: rate(rtc_checkpoint_operations_total{status="error"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Checkpoint errors detected"
          description: "Checkpoint operation failures for {{ $labels.operation }}. Rate: {{ $value }}/s."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#checkpointrrors"

      # Attachment build failures
      # Failed attachments may degrade LLM context quality.
      - alert: AttachmentBuildFailures
        expr: rate(rtc_attachment_operations_total{status="failed"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Attachment build failures"
          description: "Attachment build failures for {{ $labels.name }}. Rate: {{ $value }}/s."
          runbook_url: "https://github.com/rtc-agent/server/docs/alerts-runbook.md#attachmentbuildfailures"
