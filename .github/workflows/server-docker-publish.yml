name: Server Docker Publish

on:
  push:
    branches: [main, dev]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/server-docker-publish.yml"
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/server

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For releases: use release tag (e.g., v1.0.0)
            type=ref,event=tag
            # For releases: use commit short SHA
            type=sha,prefix=,format=short,enable=${{ github.event_name == 'release' }}
            # For releases: use latest only if not RC
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !contains(github.event.release.tag_name, '-rc') }}
            # For main branch: use commit short SHA
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            # For main branch: use latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # For dev branch: use commit SHA with -dev suffix
            type=sha,prefix=,format=short,suffix=-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # For dev branch: use dev tag
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
