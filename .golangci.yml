# golangci-lint configuration for RTC Agent server
# Documentation: https://golangci-lint.run/usage/configuration/
# Version: 2.x format

version: "2"

run:
  timeout: 5m
  go: "1.27"
  tests: true

formatters:
  enable:
    - gofmt          # Check gofmt formatting
    - goimports      # Check import formatting

  settings:
    gofmt:
      simplify: true

linters:
  enable:
    # Enabled linters
    - govet          # Go vet checks
    - errcheck       # Check for unchecked errors
    - staticcheck    # Static analysis checks (includes gosimple)
    - ineffassign    # Detect unused assignments
    - unused         # Find unused code
    - gocyclo        # Cyclomatic complexity
    - dupl           # Find duplicate code
    - nakedret       # Naked returns
    - prealloc       # Slice preallocation suggestions
    - revive         # General purpose linter
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Unused function parameters
    - depguard       # Architecture guard: enforce layered dependencies

  settings:
    govet:
      disable:
        - shadow     # Shadow checking produces too many false positives for `err` pattern

    gocyclo:
      min-complexity: 20

    dupl:
      threshold: 100

    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    # =============================================================================
    # Architecture Guard: 分层架构守护规则
    # 确保 Handler 不直接访问 Repo（数据访问层）
    # Handler 可以访问 Agent/Loop（领域服务层）
    # =============================================================================
    depguard:
      rules:
        # 规则: Handler 层不能直接导入 Repo（数据访问层）
        # Repo 应该通过 Usecase 或领域服务访问
        # 测试文件除外（测试需要 mock repo 是正常需求）
        handler-no-repo:
          files:
            - "**/internal/handler/**/*.go"
            - "!**/*_test.go"  # 排除测试文件
          deny:
            - pkg: "github.com/rtc-agent/server/internal/repo"
              desc: "Handler 层不能直接访问 Repo，请通过 Usecase 或领域服务层调用"
        # Handler 层不能直接导入 Domain（领域模型层）
        # Domain 类型应该通过 Usecase 层的返回值传递
        handler-no-domain:
          files:
            - "**/internal/handler/**/*.go"
            - "!**/*_test.go"  # 排除测试文件
          deny:
            - pkg: "github.com/rtc-agent/server/internal/domain"
              desc: "Handler 层不能直接导入 Domain，领域类型应通过 Usecase 层传递"

  exclusions:
    rules:
      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - gocyclo
          - dupl
          - errcheck

      # Exclude known linters from partially hard-vendored code
      - path: pkg/rtc-queue/
        linters:
          - dupl

issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 50

  # Maximum count of issues with the same text
  max-same-issues: 3
