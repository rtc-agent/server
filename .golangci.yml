# golangci-lint configuration for RTC Agent server
# Documentation: https://golangci-lint.run/usage/configuration/
# Version: 2.x format

version: "2"

run:
  timeout: 5m
  go: "1.27"
  tests: true

formatters:
  enable:
    - gofmt          # Check gofmt formatting
    - goimports      # Check import formatting

  settings:
    gofmt:
      simplify: true

linters:
  enable:
    # Enabled linters
    - govet          # Go vet checks
    - errcheck       # Check for unchecked errors
    - staticcheck    # Static analysis checks (includes gosimple)
    - ineffassign    # Detect unused assignments
    - unused         # Find unused code
    - gocyclo        # Cyclomatic complexity
    - dupl           # Find duplicate code
    - misspell       # Spelling mistakes
    - nakedret       # Naked returns
    - prealloc       # Slice preallocation suggestions
    - revive         # General purpose linter
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Unused function parameters

  settings:
    govet:
      check-shadowing: true

    gocyclo:
      min-complexity: 20

    dupl:
      threshold: 100

    misspell:
      # Accept both British and American English. The project uses British English
      # consistently (e.g., "cancelled", "centralised"). Setting locale to empty
      # string accepts both variants while still catching genuine typos.
      locale: ""

    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

issues:
  # Excluding configuration
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - dupl
        - errcheck

    # Exclude known linters from partially hard-vendored code
    - path: pkg/rtc-queue/
      linters:
        - dupl

  # Maximum issues count per one linter
  max-issues-per-linter: 50

  # Maximum count of issues with the same text
  max-same-issues: 3

# Output configuration
output:
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
