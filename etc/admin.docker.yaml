# RTC Agent Admin Server Docker 部署配置
# 用于 docker-compose.yml，挂载到 /app/etc/admin.yaml
# Docker 内部服务名替代 localhost（postgres/redis）

server:
  host: "0.0.0.0"
  port: 8081
  env: "development"  # WARNING: Set to "production" in production deployments

database:
  dsn: "postgres://rtc_agent:rtc_agent@postgres:5432/rtc_agent?sslmode=disable"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

log:
  level: "debug"

jwt:
  algorithm: "RS256"
  issuer: "http://admin-server:8081"  # Docker 内部服务名
  audience: "http://server-1:8888"    # RTC Agent Server 标识
  private_key_path: "/app/etc/keys/admin-private.pem"
  public_key_path: "/app/etc/keys/admin-public.pem"
  access_token_ttl: 3600      # 1 hour
  refresh_token_ttl: 604800   # 7 days

cors:
  allowed_origins: ["http://localhost:23001", "http://localhost:5173", "http://localhost:8000"]  # Grafana, Vite dev server, Admin UI dev server

security:
  rate_limit_per_minute: 100   # Max requests per minute per IP
  login_max_attempts: 5        # Max failed login attempts before lockout
  login_lock_duration: 900     # Lockout duration in seconds (15 minutes)
  cookie_secure: true          # HTTPS-only cookies in production (TLS terminates at reverse proxy)

features:
  permission_system: true      # Enable Casbin RBAC permission system
  password_enabled: false      # Disable password login in production (use OTP only)

# Email configuration for OTP login
# Set credentials via environment variables: EMAIL__SMTP_USER, EMAIL__SMTP_PASSWORD
email:
  smtp_host: "smtp.qq.com"       # SMTP server host
  smtp_port: 587                 # SMTP server port (587 for QQ with STARTTLS)
  smtp_user: ""                  # SMTP username (set via EMAIL__SMTP_USER env var)
  smtp_password: ""              # SMTP password (set via EMAIL__SMTP_PASSWORD env var)
  from_address: "524041286@qq.com" # Sender email address
  from_name: "RTC Agent"         # Sender display name

# OTP verification code settings
otp:
  ttl: 300                     # Code validity in seconds (5 minutes)
  length: 6                    # Code length (6 digits)
  send_cooldown: 60            # Cooldown between sends to same email (seconds)
  max_send_per_ip: 5           # Max send requests per IP per minute
  max_verify_attempts: 5       # Max failed verification attempts before lockout
  lock_duration: 900           # Lockout duration in seconds (15 minutes)

prometheus_url: "http://prometheus:9090"
grafana_url: "http://grafana:3000"
jaeger_url: "http://jaeger:16686"
pyroscope_url: "http://pyroscope:4040"
