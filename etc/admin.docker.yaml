# RTC Agent Admin Server Docker 部署配置
# 用于 docker-compose.yml，挂载到 /app/etc/admin.yaml
# Docker 内部服务名替代 localhost（postgres/redis）

server:
  host: "0.0.0.0"
  port: 8081
  env: "development"  # WARNING: Set to "production" in production deployments

database:
  dsn: "postgres://rtc_agent:rtc_agent@postgres:5432/rtc_agent?sslmode=disable"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

log:
  level: "debug"

jwt:
  algorithm: "RS256"
  issuer: "http://admin-server:8081"  # Docker 内部服务名
  audience: "http://server-1:8888"    # RTC Agent Server 标识
  private_key_path: "/app/etc/keys/admin-private.pem"
  public_key_path: "/app/etc/keys/admin-public.pem"
  access_token_ttl: 3600      # 1 hour
  refresh_token_ttl: 604800   # 7 days

cors:
  allowed_origins: ["http://localhost:23001", "http://localhost:5173", "http://localhost:8000"]  # Grafana, Vite dev server, Admin UI dev server

security:
  rate_limit_per_minute: 100   # Max requests per minute per IP
  login_max_attempts: 5        # Max failed login attempts before lockout
  login_lock_duration: 900     # Lockout duration in seconds (15 minutes)

prometheus_url: "http://prometheus:9090"
grafana_url: "http://grafana:3000"
jaeger_url: "http://jaeger:16686"
pyroscope_url: "http://pyroscope:4040"
