server:
  host: "0.0.0.0"
  port: 8888

database:
  # 开发环境使用 Docker Compose，PostgreSQL 端口为非标准 15432
  dsn: "postgres://rtc_agent:rtc_agent@localhost:15432/rtc_agent?sslmode=disable"
  auto_migrate: true

redis:
  # 开发环境使用 Docker Compose，Redis 端口为非标准 16379
  addr: "localhost:16379"
  password: ""
  db: 0

log:
  level: "info"  # debug, info, warn, error
  # 启用后将完整 LLM 请求/响应写入 logs/llm-payload.log（JSON Lines）
  # 仅开发环境使用，生产环境请勿开启
  llm_payload: false
  # 服务器日志文件路径（JSON 格式，用于 promtail 采集）
  # 留空则不写文件。所有日志文件均使用 lumberjack 自动轮转（100MB/文件，保留 3 个，7 天，gzip 压缩）
  server_log_file: "etc/dev/logs/server.log"

auth:
  # JWT 签名密钥（开发环境示例值，生产环境请使用强随机字符串）
  jwt_secret: "rtc-agent-dev-jwt-secret-change-me-in-production"
  # access_token 默认有效期（秒）
  access_token_ttl_seconds: 3600

providers:
  mock:
    enabled: true
    url: "http://localhost:10060"
    client_id: "test-client"
    client_secret: "test-client-secret"

cors:
  # 开发环境：为空时允许任意 origin（生产环境必须显式配置）
  allow_origins: []

# LLM 模型配置（开发环境示例）
# 取消注释并填入实际配置以启用 agent 功能
llm:
  provider: "openai"
  api_key: "${LLM_API_KEY}"
  model: "google/gemma-4-e4b"
  base_url: "http://127.0.0.1:1234/v1"
  max_tokens: 131072
  # 重试配置（可选）
  # retry_max_attempts: 3  # 最大重试次数，0 表示不重试（默认）
  # retry_base_delay: 1s   # 重试基础退避时间，实际退避 = base_delay * 2^(attempt-1)

  # 模型定价配置（可选，用于成本计算）
  # 未配置时使用默认价格（Claude 3.5 Sonnet）
  # pricing:
  #   input_per_million: 3.0        # 正常 input token 价格（USD）
  #   output_per_million: 15.0      # output token 价格（USD）
  #   cached_read_per_million: 0.3  # cache read 价格（USD），通常为 input 的 10%
  #   cached_write_per_million: 3.75 # cache write 价格（USD），通常为 input 的 125%
  #   reasoning_per_million: 0.0    # reasoning token 价格（USD）

# Worker 配置（开发环境）
worker:
  # Agent 系统提示词（可选）
  # 留空时使用内置的 section-based 系统提示词（推荐）。
  # 内置提示词由 internal/agent/prompts/system/ 下的多个 .md 文件组合而成：
  #   identity.md, first-step.md, workflow.md, critical-rules.md,
  #   language-and-principles.md, memory-system.md, todo-system.md
  # 如需完全覆盖内置提示词，在此处填写完整内容：
  # system_prompt: |
  #   You are a custom assistant...
  # 上下文压缩提示词（可选）
  # summarize_prompt: "Please summarize..."
  # 触发上下文压缩的 token 阈值（默认 25000）
  context_tokens_limit: 25000
  # 自动压缩缓冲 token 数（默认 13000）
  # 用于计算实际触发阈值：context_tokens_limit - auto_compact_buffer_tokens
  auto_compact_buffer_tokens: 13000
  # 压缩时最大输出 token 数（默认 20000）
  max_output_tokens_for_summary: 20000

# Embedding 服务配置（用于 User Memory 向量检索）
# 取消注释并填入实际配置以启用 User Memory 的向量检索功能
# embedding:
#   enabled: true
#   base_url: "http://localhost:1234/v1"  # LM Studio 或其他 OpenAI 兼容 API
#   api_key: ""  # LM Studio 本地部署无需 API key，云服务填入对应 key
#   model: "text-embedding-3-small"  # 或 "all-MiniLM-L6-v2", "WeMM-Embedding-2B" 等
#   dimension: 1536  # 向量维度：1536 (text-embedding-3-small), 384 (all-MiniLM-L6-v2), 2048 (WeMM-Embedding-2B)
#   timeout: 30s

# OpenTelemetry 分布式追踪配置
tracing:
  enabled: true  # 开发环境启用 tracing
  endpoint: "localhost:4317"  # Jaeger OTLP gRPC endpoint
  sample_rate: 1.0  # 全量采样（开发环境）
