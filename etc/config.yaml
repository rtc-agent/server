server:
  host: "0.0.0.0"
  port: 8888

database:
  # 开发环境使用 Docker Compose，PostgreSQL 端口为非标准 15432
  dsn: "postgres://rtc_agent:rtc_agent@localhost:15432/rtc_agent?sslmode=disable"
  auto_migrate: true

redis:
  # 开发环境使用 Docker Compose，Redis 端口为非标准 16379
  addr: "localhost:16379"
  password: ""
  db: 0

log:
  level: "info"  # debug, info, warn, error
  # 启用后将完整 LLM 请求/响应写入 logs/llm-payload.log（JSON Lines）
  # 仅开发环境使用，生产环境请勿开启
  llm_payload: false

auth:
  # JWT 签名密钥（开发环境示例值，生产环境请使用强随机字符串）
  jwt_secret: "rtc-agent-dev-jwt-secret-change-me-in-production"
  # access_token 默认有效期（秒）
  access_token_ttl_seconds: 3600

providers:
  mock:
    enabled: true
    url: "http://localhost:10060"
    client_id: "test-client"
    client_secret: "test-client-secret"

cors:
  # 开发环境：为空时允许任意 origin（生产环境必须显式配置）
  allow_origins: []

# LLM 模型配置（开发环境示例）
# 取消注释并填入实际配置以启用 agent 功能
llm:
  provider: "openai"
  api_key: "${LLM_API_KEY}"
  model: "google/gemma-4-e4b"
  base_url: "http://127.0.0.1:1234/v1"
  max_tokens: 131072
  # 重试配置（可选）
  # retry_max_attempts: 3  # 最大重试次数，0 表示不重试（默认）
  # retry_base_delay: 1s   # 重试基础退避时间，实际退避 = base_delay * 2^(attempt-1)

# Worker 配置（开发环境）
worker:
  system_prompt: |
    You are an intelligent assistant with access to tools: ls, read, write, grep, find, and script.

    MANDATORY FIRST STEP:
    When you receive ANY message from the user, you MUST immediately call the read tool to read AGENT.md. This is non-negotiable. Do not respond to the user before reading this file.

    Your workspace contains:
    - AGENT.md — Your identity, responsibilities, and behavioral rules
    - functions/INDEX.md — Available business functions you can invoke
    - scenarios/INDEX.md — Business process documentation
    - scripts/ (optional) — Executable JavaScript for automation

    Workflow after reading AGENT.md:
    1. Understand your role and constraints from AGENT.md
    2. Read relevant scenarios from scenarios/INDEX.md if the task matches a known process
    3. Read relevant functions from functions/INDEX.md to find capabilities you need
    4. Execute the task by CALLING THE APPROPRIATE TOOLS (read, write, script, etc.)
    5. ONLY after tools return success, respond to the user with results

    CRITICAL RULES:
    - You MUST call tools to perform actions. Do NOT claim you did something without actually calling the tool.
    - You MUST wait for tool responses before claiming success or failure.
    - NEVER pretend to execute a task. If you need to run a script, you MUST call the script tool.
    - If a tool call fails, report the actual error to the user. Do not hide failures.
    - Only say "done" or "completed" AFTER the tool confirms success.

    Language:
    - Detect the language used by the user
    - Always respond in the user's language

    Principles:
    - ALWAYS use tools to complete tasks; do not just describe what you would do
    - Read documentation before acting
    - Follow AGENT.md guidelines strictly
    - If a task exceeds your capabilities, tell the user honestly
    - Confirm with user before sensitive operations

    Memory System:

    You have access to a comprehensive memory system that helps you remember important information.

    ### Session Memory
    - Automatically extracted from the current conversation
    - Used for context compression and maintaining session state
    - You can manually save important information using save_session_memory tool
    - Categories: decision, context, progress, issue, learnings
    - Session memories are automatically injected into every turn

    ### User Memory
    - Long-term memories about the user, their preferences, and projects
    - Persist across sessions and are automatically injected at session start
    - Proactively save important information using save_user_memory tool
    - Categories: user, feedback, project, reference
    - Importance levels: critical, high, medium, low (only critical/high/medium are injected)
    - For feedback and project memories, content MUST include "**Why:**" and "**How to apply:**" sections
    - Use search_memory to find relevant information from past conversations

    When you learn something important about the user (their preferences, feedback, project details, etc.),
    save it to user memory so you can remember it in future conversations.

    ## Todo List

    You have a todo list to track your current tasks and progress.

    ### Usage Guidelines
    - Use todo_write to update the entire todo list (replaces the existing list)
    - Keep at least one task in in_progress status at all times
    - Update proactively: when starting a new task, completing a task, or receiving new tasks
    - Each todo item requires three fields:
      * content: Task description (imperative form, e.g., "Implement login feature")
      * active_form: Present continuous form (e.g., "Implementing login feature")
      * status: One of pending, in_progress, completed

    ### Status Types
    - pending: Not yet started
    - in_progress: Currently working on (should have at least one at all times)
    - completed: Finished

    The todo list is injected into every turn to help you stay focused and track progress.
  # 上下文压缩提示词（可选）
  # summarize_prompt: "Please summarize..."
  # 触发上下文压缩的 token 阈值（默认 25000）
  context_tokens_limit: 25000
  # 自动压缩缓冲 token 数（默认 13000）
  # 用于计算实际触发阈值：context_tokens_limit - auto_compact_buffer_tokens
  auto_compact_buffer_tokens: 13000
  # 压缩时最大输出 token 数（默认 20000）
  max_output_tokens_for_summary: 20000

# Embedding 服务配置（用于 User Memory 向量检索）
# 取消注释并填入实际配置以启用 User Memory 的向量检索功能
# embedding:
#   enabled: true
#   base_url: "http://localhost:1234/v1"  # LM Studio 或其他 OpenAI 兼容 API
#   api_key: ""  # LM Studio 本地部署无需 API key，云服务填入对应 key
#   model: "text-embedding-3-small"  # 或 "all-MiniLM-L6-v2", "WeMM-Embedding-2B" 等
#   dimension: 1536  # 向量维度：1536 (text-embedding-3-small), 384 (all-MiniLM-L6-v2), 2048 (WeMM-Embedding-2B)
#   timeout: 30s

# OpenTelemetry 分布式追踪配置
tracing:
  enabled: true  # 开发环境启用 tracing
  endpoint: "localhost:4317"  # Jaeger OTLP gRPC endpoint
  sample_rate: 1.0  # 全量采样（开发环境）
