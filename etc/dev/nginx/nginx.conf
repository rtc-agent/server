events {
    worker_connections 1024;
}

http {
    # 增加请求体大小限制（支持大文件上传）
    client_max_body_size 200M;

    upstream rtc-agent {
        # 最少连接数负载均衡，适合长连接 WebSocket 场景
        least_conn;
        server server-1:8888;
        server server-2:8888;
    }

    upstream admin-server {
        server admin-server:8081;
    }

    server {
        listen 80;
        server_name localhost;

        # Admin Server（后台管理系统）
        location /admin/ {
            proxy_pass http://admin-server/;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin API（/api/auth/* 路由到 admin-server）
        location /api/auth/ {
            proxy_pass http://admin-server/api/auth/;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # JWKS 端点（admin-server 提供）
        location /.well-known/jwks.json {
            proxy_pass http://admin-server/.well-known/jwks.json;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket + HTTP 反向代理（RTC Agent Server）
        location / {
            proxy_pass http://rtc-agent;
            proxy_http_version 1.1;

            # WebSocket 升级头
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 保持原始 Host header（对 SigV4 签名验证至关重要）
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 长连接超时
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
