global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # RTC Agent server metrics (exposed on the main HTTP port)
  - job_name: "rtc-agent-server"
    static_configs:
      - targets: ["host.docker.internal:8888"]
        labels:
          service: "rtc-agent"

