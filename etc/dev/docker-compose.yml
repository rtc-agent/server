name: rtc-agent

services:
  redis:
    image: redis:7-alpine
    container_name: rtc-agent-redis
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: rtc-agent-postgres
    environment:
      POSTGRES_USER: rtc_agent
      POSTGRES_PASSWORD: rtc_agent
      POSTGRES_DB: rtc_agent
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: rtc-agent-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    restart: unless-stopped

  # ===========================================================================
  # Observability Stack
  # ===========================================================================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rtc-agent-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    container_name: rtc-agent-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    container_name: rtc-agent-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    depends_on:
      - loki
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:1.9.1
    container_name: rtc-agent-pyroscope
    command:
      - "server"
      - "--storage.path=/var/lib/pyroscope"
    ports:
      - "4040:4040"
    volumes:
      - pyroscope-data:/var/lib/pyroscope
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rtc-agent-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - pyroscope
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: rtc-agent-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  # ===========================================================================
  # Application Services
  # ===========================================================================

  mock-oauth2:
    build:
      context: ../..
      dockerfile: Dockerfile.mock-oauth2
    container_name: rtc-agent-mock-oauth2
    ports:
      - "10060:10060"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: rtc-agent-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mock-oauth2
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  loki-data:
  pyroscope-data:
  alertmanager-data:
  grafana-data:
  promtail-positions:
