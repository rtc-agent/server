# RTC Agent Docker 部署配置
# 用于 docker-compose.yml，挂载到 /app/etc/config.yaml
# Docker 内部服务名替代 localhost（postgres/redis/jaeger）

server:
  host: "0.0.0.0"
  port: 8888
  env: "development"

database:
  dsn: "postgres://rtc_agent:rtc_agent@postgres:5432/rtc_agent?sslmode=disable"
  auto_migrate: true

redis:
  addr: "redis:6379"
  password: ""
  db: 0

log:
  level: "debug"
  llm_payload: true

auth:
  jwt_secret: "rtc-agent-dev-jwt-secret-change-me-in-production"
  access_token_ttl_seconds: 3600

providers:
  mock:
    enabled: false
    url: "http://192.168.31.60:20060"
    client_id: "test-client"
    client_secret: "test-client-secret"

cors:
  allow_origins: ["*"]

# LLM 配置
# 优先级说明：config file > environment variable > default
# 敏感字段（如 api_key）建议通过环境变量配置，不在 YAML 中写明文
# 环境变量命名规则：大写字母 + 双下划线分隔层级（如 llm.api_key → LLM__API_KEY）
llm:
  provider: "claude"
  # api_key 通过环境变量 LLM__API_KEY 配置，见 .env 文件
  model: "qwen3.7-plus"
  base_url: "http://host.docker.internal:23000"
  max_tokens: 131072
  retry_max_attempts: 10
  retry_base_delay: 1s

  # 模型定价配置（可选，用于成本计算）
  # 未配置时使用默认价格（Claude 3.5 Sonnet）
  # pricing:
  #   input_per_million: 3.0        # 正常 input token 价格（USD）
  #   output_per_million: 15.0      # output token 价格（USD）
  #   cached_read_per_million: 0.3  # cache read 价格（USD），通常为 input 的 10%
  #   cached_write_per_million: 3.75 # cache write 价格（USD），通常为 input 的 125%
  #   reasoning_per_million: 0.0    # reasoning token 价格（USD）

# Worker 配置
worker:
  context_tokens_limit: 600000
  auto_compact_buffer_tokens: 100000
  max_output_tokens_for_summary: 20000

# OpenTelemetry 分布式追踪
tracing:
  enabled: true
  endpoint: "jaeger:4317"
  sample_rate: 1.0

# Web Search 配置
web_search:
  enabled: true
  balancer_type: "round_robin"
  global_timeout: 30s

  providers:
    - name: "tavily"
      type: "tavily"
      weight: 100
      enabled: true
      api_key: "${TAVILY_API_KEY}"
      max_results: 10
      search_depth: "basic"
      include_answer: false

  proxies:
    - url: "socks5://192.168.31.60:7897"
      type: "socks5"
      region: "global"
      priority: 10

  circuit_breaker:
    failure_threshold: 50
    open_timeout: 60s
    half_open_max_requests: 3
    window_size: 100
    window_duration: 5m

  rate_limiter:
    rate: 10
    burst: 20

  retry:
    max_retries: 3
    retry_delay: 1s
    backoff_factor: 2.0

  # Redis 配置（可选）
  # 如果不配置，将使用全局 redis 配置（见上方 redis 部分）
  # 仅在需要为 web_search 使用独立 redis 实例时才取消注释
  # redis:
  #   addr: "redis:6379"
  #   password: ""
  #   db: 0

# Web Fetch 配置
web_fetch:
  enabled: true
  max_concurrency: 20
  max_domain_concurrency: 5
  cache_ttl: 30m
  cache_max_size: 1000
  max_url_length: 2000
  max_content_size: 10485760  # 10MB
  fetch_timeout: 60s
  max_redirects: 10

  # LLM 提取配置
  llm_extract_threshold: 50000
  llm_cache_ttl: 1h
  max_llm_per_session: 50
  llm_max_tokens: 4096

  # 速率限制
  rate_limit:
    global_rate: 100
    global_burst: 200
    domain_rate: 10
    domain_burst: 20

  # Robots.txt 合规
  respect_robots_txt: true
  robots_cache_ttl: 24h

  # 熔断器配置
  circuit_breaker:
    enabled: true
    failure_threshold: 50
    open_timeout: 30s
    half_open_max_requests: 3
    window_size: 20
    window_duration: 1m

  # 代理池配置
  proxies:
    - url: "socks5://192.168.31.60:7897"
      type: "socks5"
      region: "global"
      priority: 10
  proxy_health_url: "https://www.google.com"
  proxy_check_interval: 30s

  # 安全配置
  pre_approved_domains:
    - "github.com"
    - "stackoverflow.com"
    - "developer.mozilla.org"
    - "docs.python.org"
    - "pkg.go.dev"
  blocked_domains: []
  allowed_schemes:
    - "https"
    - "http"

  # Redis 配置（用于缓存和速率限制）
  # 如果不配置，将使用全局 redis 配置
  redis:
    addr: "redis:6379"
    password: ""
    db: 0

  user_agent: "RTCAgent-WebFetch/1.0"
